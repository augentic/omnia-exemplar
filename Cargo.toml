[package]
name = "guest"
description = "Exemplar WASM guest"
readme = "README.md"
publish = false
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
# Compile in the god-mode trip override route (operational tool, off by default).
god-mode = ["gtfs-adapter/god-mode"]

[lib]
# `rlib` lets the native route rung (`tests/routes.rs`) link the routers.
crate-type = ["cdylib", "rlib"]

[dependencies]
acme-common.workspace = true
axum.workspace = true
capability.workspace = true
docstore.workspace = true
gtfs-adapter.workspace = true
omnia-sdk.workspace = true
omnia-wasi-http.workspace = true
omnia-wasi-messaging.workspace = true
omnia-wasi-otel.workspace = true
pattern.workspace = true
pulse-adapter.workspace = true
pulse-connector.workspace = true
serde_json.workspace = true
sql.workspace = true
tally-connector.workspace = true
tracing.workspace = true
wasip3.workspace = true

[dev-dependencies]
cfg-if.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
bytes.workspace = true
chrono.workspace = true
http.workspace = true
http-body-util.workspace = true
omnia.workspace = true
omnia-wasi-blobstore.workspace = true
omnia-wasi-config.workspace = true
omnia-wasi-docstore.workspace = true
omnia-wasi-identity.workspace = true
omnia-wasi-keyvalue.workspace = true
omnia-wasi-sql.workspace = true
omnia-test = { workspace = true, features = ["guest", "host"] }
omnia-wasi-websocket.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower.workspace = true

# The fixture rung: `build.rs` compiles this package to a `wasm32-wasip2`
# component for `tests/component.rs`. `build` is `std`-only by contract.
[build-dependencies]
omnia-test = { workspace = true, features = ["build"] }

[[example]]
name = "runtime"
path = "examples/runtime.rs"

[workspace]
members = ["crates/*", "templates/check"]
resolver = "3"

[workspace.package]
authors = ["Augentic"]
categories = ["wasm", "web-programming", "asynchronous"]
edition = "2024"
homepage = "https://augentic.io"
keywords = ["exemplar", "omnia", "wasi", "wasm", "component-model"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/augentic/omnia-exemplar"
rust-version = "1.97"
version = "0.1.0"

[workspace.lints.rust]
# https://dirname.github.io/rust-std-doc/rustc/lints/listing/allowed-by-default.html
missing_docs = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"

[workspace.lints.clippy]
# https://doc.rust-lang.org/stable/clippy/index.html
all = "warn"      # correctness, suspicious, style, complexity, perf
cargo = "warn"
nursery = "warn"
pedantic = "warn"

# Cherry-picked lints are from the `restriction` lint group in order to drive up
# consistency, quality, and brevity
# See https://microsoft.github.io/rust-guidelines/guidelines/universal/index.html
# allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["json"] }
bytes = "1.12.1"
cfg-if = "1.0.5"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
quick-xml = { version = "0.41.0", features = ["serde", "serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.0.1"
serde_json = "1.0.151"
serde_repr = "0.1.21"
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false, features = [
    "io-util",
    "macros",
    "rt",
    "sync",
    "time",
] }
toml = "1.1.4"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing = "0.1.44"
urlencoding = "2.1.3"
uuid = { version = "1.24.0", features = ["v4"] }
wasip3 = { version = "0.9.0", features = ["http-compat"] }

# Every `omnia-*` line below moves together: bump them to the same release
# in one change, and keep the shared pins above (`wasip3`, `http`, `axum`,
# `tokio`, …) at the versions omnia itself pins so the guest links one copy
# of each. Never re-add a `[patch.crates-io]` git or path override here —
# the crates are published, and the scaffold test builds against the same
# published set.
omnia = "0.36.0"
omnia-sdk = "0.36.0"
omnia-wasi-blobstore = "0.36.0"
omnia-wasi-config = "0.36.0"
omnia-wasi-docstore = "0.36.0"
omnia-wasi-http = "0.36.0"
omnia-wasi-identity = "0.36.0"
omnia-wasi-keyvalue = "0.36.0"
omnia-wasi-messaging = "0.36.0"
omnia-wasi-otel = "0.36.0"
omnia-wasi-sql = "0.36.0"
# No default features: each consumer names its rung. A workspace-level
# `guest` feature would unify into the root `[build-dependencies]` line and
# drag `omnia-sdk` into the build-script graph.
omnia-test = "0.36.0"
omnia-wasi-websocket = "0.36.0"

# omnia-extensions releases track omnia's: bump both together with the
# `omnia-*` lines above.
omnia-http-cache = "0.34.0"
omnia-orm = "0.34.0"

acme-common = { path = "crates/common" }
capability = { path = "crates/capability" }
docstore = { path = "crates/docstore" }
gtfs-adapter = { path = "crates/gtfs-adapter" }
pattern = { path = "crates/pattern" }
pulse-adapter = { path = "crates/pulse-adapter" }
pulse-connector = { path = "crates/pulse-connector" }
sql = { path = "crates/sql" }
tally-connector = { path = "crates/tally-connector" }

[profile.release]
lto = true
opt-level = "s"
strip = true

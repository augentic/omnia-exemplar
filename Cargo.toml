[workspace]
members = ["crates/*", "guests/*", "templates/check"]
resolver = "3"

[workspace.package]
authors = ["Augentic"]
categories = ["wasm", "web-programming", "asynchronous"]
edition = "2024"
homepage = "https://augentic.io"
keywords = ["exemplar", "omnia", "wasi", "wasm", "component-model"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/augentic/omnia-exemplar"
rust-version = "1.97"
version = "0.1.0"

[workspace.lints.rust]
# https://dirname.github.io/rust-std-doc/rustc/lints/listing/allowed-by-default.html
missing_docs = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"

[workspace.lints.clippy]
# https://doc.rust-lang.org/stable/clippy/index.html
all = "warn"      # correctness, suspicious, style, complexity, perf
cargo = "warn"
nursery = "warn"
pedantic = "warn"

# Cherry-picked lints are from the `restriction` lint group in order to drive up
# consistency, quality, and brevity
# See https://microsoft.github.io/rust-guidelines/guidelines/universal/index.html

# allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["json"] }
bytes = "1.12.1"
cfg-if = "1.0.4"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
http = "1.4.2"
http-body = "1.1.0"
http-body-util = "0.1.4"
quick-xml = { version = "0.41.0", features = ["serde", "serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "0.0.29"
serde_json = "1.0.151"
serde_repr = "0.1.20"
thiserror = "2.0.18"
toml = "1.1.3"
tokio = { version = "1.53.1", default-features = false, features = [
    "io-util",
    "macros",
    "rt",
    "sync",
    "time",
] }
tracing = "0.1.44"
urlencoding = "2.1.3"
uuid = { version = "1.19.0", features = ["v4"] }
wasip3 = { version = "0.7.0", features = ["http-compat"] }
wit-bindgen = { version = "0.60.0", features = ["async-spawn"] }

omnia = "0.35.0"
omnia-guest = "0.35.0"
omnia-wasi-config = "0.35.0"
omnia-wasi-http = "0.35.0"
omnia-wasi-identity = "0.35.0"
omnia-wasi-keyvalue = "0.35.0"
omnia-wasi-messaging = "0.35.0"
omnia-wasi-otel = "0.35.0"
omnia-wasi-sql = "0.35.0"

# Internally referenced crates
acme-common = { path = "crates/common" }
acme-test = { path = "crates/test" }
capability-examples = { path = "crates/capability-examples" }
gtfs-adapter = { path = "crates/gtfs-adapter" }
pulse-adapter = { path = "crates/pulse-adapter" }
pulse-connector = { path = "crates/pulse-connector" }
tally-connector = { path = "crates/tally-connector" }

# Pinned to the exact rev declared in `exemplar.yaml`; the manifest, not
# an incidental lock resolution, declares Omnia compatibility.
[patch.crates-io]
omnia = { git = "https://github.com/augentic/omnia", rev = "08cd05a3363260e7f47e1cf3848a923d7ed5df2d" }
omnia-guest = { git = "https://github.com/augentic/omnia", rev = "08cd05a3363260e7f47e1cf3848a923d7ed5df2d" }
omnia-wasi-config = { git = "https://github.com/augentic/omnia", rev = "08cd05a3363260e7f47e1cf3848a923d7ed5df2d" }
omnia-wasi-http = { git = "https://github.com/augentic/omnia", rev = "08cd05a3363260e7f47e1cf3848a923d7ed5df2d" }
omnia-wasi-identity = { git = "https://github.com/augentic/omnia", rev = "08cd05a3363260e7f47e1cf3848a923d7ed5df2d" }
omnia-wasi-keyvalue = { git = "https://github.com/augentic/omnia", rev = "08cd05a3363260e7f47e1cf3848a923d7ed5df2d" }
omnia-wasi-messaging = { git = "https://github.com/augentic/omnia", rev = "08cd05a3363260e7f47e1cf3848a923d7ed5df2d" }
omnia-wasi-otel = { git = "https://github.com/augentic/omnia", rev = "08cd05a3363260e7f47e1cf3848a923d7ed5df2d" }
omnia-wasi-sql = { git = "https://github.com/augentic/omnia", rev = "08cd05a3363260e7f47e1cf3848a923d7ed5df2d" }

# `wrpc-wasmtime` 0.1.0 is unpublished on crates.io.
wrpc-transport = { git = "https://github.com/bytecodealliance/wrpc" }
wrpc-wasmtime = { git = "https://github.com/bytecodealliance/wrpc" }

[profile.release]
lto = true
opt-level = "s"
strip = true

[package]
name = "guest"
description = "Exemplar WASM guest"
readme = "README.md"
publish = false
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
# Compile in the god-mode trip override route (operational tool, off by default).
god-mode = ["gtfs-adapter/god-mode"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
capability.workspace = true
common.workspace = true
docstore.workspace = true
gtfs-adapter.workspace = true
omnia-sdk.workspace = true
pattern.workspace = true
pulse-adapter.workspace = true
pulse-connector.workspace = true
sql.workspace = true
tally-connector.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
axum.workspace = true
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
omnia.workspace = true
omnia-test = { workspace = true, features = ["host"] }
omnia-wasi-blobstore.workspace = true
omnia-wasi-config.workspace = true
omnia-wasi-docstore.workspace = true
omnia-wasi-http.workspace = true
omnia-wasi-identity.workspace = true
omnia-wasi-keyvalue.workspace = true
omnia-wasi-messaging.workspace = true
omnia-wasi-otel.workspace = true
omnia-wasi-sql.workspace = true
omnia-wasi-websocket.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower.workspace = true

[build-dependencies]
omnia-test = { workspace = true, features = ["build"] }

[[example]]
name = "runtime"
path = "examples/runtime.rs"

[workspace]
members = ["crates/*", "templates/check", "templates/guest"]
resolver = "3"

[workspace.package]
authors = ["Augentic"]
categories = ["wasm", "web-programming", "asynchronous"]
edition = "2024"
homepage = "https://augentic.io"
keywords = ["exemplar", "omnia", "wasi", "wasm", "component-model"]
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/augentic/omnia-exemplar"
rust-version = "1.100"
version = "0.2.0"

[workspace.lints.rust]
meta_variable_misuse = "warn"
missing_docs = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# cherry-picked `restriction`s
allow_attributes = "deny"
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
dbg_macro = "warn"
disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_script_idents = "warn"
disallowed_types = "deny"
empty_drop = "warn"
fn_to_numeric_cast_any = "warn"
map_err_ignore = "warn"
print_stderr = "warn"
print_stdout = "warn"
unused_result_ok = "warn"

[workspace.dependencies]
anyhow = "1.0.105"
axum = { version = "0.8.9", default-features = false, features = ["json", "query"] }
bytes = "1.12.2"
http = "1.5.0"
http-body-util = "0.1.5"
jiff = { version = "1.0.3", features = ["serde", "static"] }
quick-xml = { version = "0.42.0", features = ["serde", "serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.2.0"
serde_json = "1.0.154"
serde_repr = "0.1.21"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = [
    "io-util",
    "macros",
    "rt",
    "sync",
    "time",
] }
toml = "1.2.2"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing = "0.1.44"
urlencoding = "2.1.3"
uuid = { version = "1.29.3", features = ["serde", "v4"] }

omnia = "0.38.1"
omnia-sdk = "0.38.1"
omnia-test = "0.38.1"
omnia-wasi-blobstore = "0.38.1"
omnia-wasi-config = "0.38.1"
omnia-wasi-docstore = "0.38.1"
omnia-wasi-http = "0.38.1"
omnia-wasi-identity = "0.38.1"
omnia-wasi-keyvalue = "0.38.1"
omnia-wasi-messaging = "0.38.1"
omnia-wasi-otel = "0.38.1"
omnia-wasi-sql = "0.38.1"
omnia-wasi-websocket = "0.38.1"

capability = { path = "crates/capability" }
common = { path = "crates/common" }
docstore = { path = "crates/docstore" }
gtfs-adapter = { path = "crates/gtfs-adapter" }
omnia-template = { path = "templates/guest" }
pattern = { path = "crates/pattern" }
pulse-adapter = { path = "crates/pulse-adapter" }
pulse-connector = { path = "crates/pulse-connector" }
sql = { path = "crates/sql" }
tally-connector = { path = "crates/tally-connector" }

[profile.release]
lto = true
opt-level = "s"
strip = true

# The handler suites JIT-compile each guest, and unoptimized cranelift is ~10x
# slower.
[profile.dev.package]
cranelift-codegen = { opt-level = 3 }
regalloc2 = { opt-level = 3 }
wasmtime-internal-cranelift = { opt-level = 3 }

# Clippy does not merge config files: this file fully shadows the workspace
# root `clippy.toml` for everything under `crates/`, so the shared settings
# (`doc-valid-idents`, `allowed-duplicate-crates`) must be duplicated here.
doc-valid-idents = [
  "GTFS",
  "GitHub",
  "OpenTelemetry",
  "SemVer",
  "WebAssembly",
  "WebSocket",
  "WebSockets",
]

allowed-duplicate-crates = [
  "axum",
  "axum-core",
  "base64",
  "block-buffer",
  "const-oid",
  "core-foundation",
  "cpufeatures",
  "crypto-common",
  "darling",
  "darling_core",
  "darling_macro",
  "digest",
  "embedded-io",
  "foldhash",
  "getrandom",
  "hashbrown",
  "indexmap",
  "io-lifetimes",
  "itertools",
  "linux-raw-sys",
  "lock_api",
  "matchit",
  "parking_lot",
  "parking_lot_core",
  "prettyplease",
  "quick-xml",
  "r-efi",
  "rand",
  "rand_chacha",
  "rand_core",
  "reqwest",
  "redox_syscall",
  "rustix",
  "rustls",
  "rustls-native-certs",
  "rustls-webpki",
  "sha2",
  "socket2",
  "strum",
  "strum_macros",
  "syn",
  "thiserror",
  "thiserror-impl",
  "tokio-rustls",
  "untrusted",
  "wasi",
  "wasip3",
  "wasm-encoder",
  "wasm-metadata",
  "wasmparser",
  "wast",
  "webpki-roots",
  "windows-link",
  "windows-result",
  "windows-strings",
  "windows-sys",
  "windows-targets",
  "windows_aarch64_gnullvm",
  "windows_aarch64_msvc",
  "windows_i686_gnu",
  "windows_i686_gnullvm",
  "windows_i686_msvc",
  "windows_x86_64_gnu",
  "windows_x86_64_gnullvm",
  "windows_x86_64_msvc",
  "wit-bindgen",
  "wit-bindgen-core",
  "wit-bindgen-rust",
  "wit-bindgen-rust-macro",
  "wit-component",
  "wit-parser",

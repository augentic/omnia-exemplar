[package]
name = "docstore"
description = "Rich wasi:docstore showcase: GTFS-like collections exercising portable and optional filters, sorting, and continuation pagination"
readme = "README.md"
publish = false
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["lib"]

[[example]]
name = "docstore-guest"
path = "guest.rs"
crate-type = ["cdylib"]

[dependencies]
axum.workspace = true
omnia-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[build-dependencies]
omnia-test = { workspace = true, features = ["build"] }

# Target-gated so the guest's wasm32 dependency graph never sees the host.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
bytes.workspace = true
http.workspace = true
omnia.workspace = true
omnia-test = { workspace = true, features = ["host"] }
omnia-wasi-docstore.workspace = true
omnia-wasi-http.workspace = true
omnia-wasi-messaging.workspace = true
omnia-wasi-otel.workspace = true
tokio.workspace = true
urlencoding.workspace = true

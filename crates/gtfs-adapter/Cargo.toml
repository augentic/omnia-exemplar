[package]
name = "gtfs-adapter"
description = "GTFS adapter domain logic"
readme = "README.md"
publish = false
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
# Enables the god-mode trip override operation. Off by default: it is an
# operational/testing tool, not part of the production pipeline.
god-mode = []

[[example]]
name = "gtfs-adapter-guest"
path = "guest.rs"
crate-type = ["cdylib"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
bytes.workspace = true
common.workspace = true
http.workspace = true
jiff.workspace = true
omnia-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
urlencoding.workspace = true
uuid.workspace = true

[build-dependencies]
omnia-test = { workspace = true, features = ["build"] }

# Target-gated so the guest's wasm32 dependency graph never sees the host.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
omnia.workspace = true
omnia-test = { workspace = true, features = ["host"] }
omnia-wasi-config.workspace = true
omnia-wasi-http.workspace = true
omnia-wasi-identity.workspace = true
omnia-wasi-keyvalue.workspace = true
omnia-wasi-messaging.workspace = true
omnia-wasi-otel.workspace = true
tokio.workspace = true

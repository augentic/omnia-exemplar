[package]
name = "pattern"
description = "Composition patterns over the Omnia guest capabilities: cache-aside decoding, compare-and-swap optimistic locking, identity access tokens, relational geo queries, and structured JSON error bodies"
readme = "README.md"
publish = false
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["lib"]

[[example]]
name = "pattern-guest"
path = "guest.rs"
crate-type = ["cdylib"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
omnia-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[build-dependencies]
omnia-test = { workspace = true, features = ["build"] }

# Target-gated so the guest's wasm32 dependency graph never sees the host.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
bytes.workspace = true
omnia.workspace = true
omnia-test = { workspace = true, features = ["host"] }
omnia-wasi-config.workspace = true
omnia-wasi-http.workspace = true
omnia-wasi-identity.workspace = true
omnia-wasi-keyvalue.workspace = true
omnia-wasi-messaging.workspace = true
omnia-wasi-otel.workspace = true
omnia-wasi-sql.workspace = true
tokio.workspace = true

# https://embarkstudios.github.io/cargo-deny

[graph]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
exclude-dev = true

[output]
feature-depth = 1

[advisories]
unmaintained = "workspace"
ignore = [
]

[licenses]
allow = [
  "Apache-2.0 WITH LLVM-exception",
  "Apache-2.0",
  "BSD-3-Clause",
  "BSL-1.0",
  "MIT",
  "Unicode-3.0",
]

[licenses.private]
ignore = true

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[sources]
allow-git = [
  "https://github.com/augentic/omnia",
  "https://github.com/augentic/omnia-extensions",
]
private = [
]

[bans]
deny = [
  { name = "tokio", deny-multiple-versions = true },
  { name = "wasmtime" },
  { name = "omnia-core" },
]
multiple-versions = "allow"
skip = []
skip-tree = []
wildcards = "allow"

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
# `exclude-dev = true` prunes dev-only workspace dependencies from the graph.
unused = "allow"

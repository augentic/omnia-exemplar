[package]
name = "guest-axum"
description = "Exemplar guest using plain Axum handlers over omnia-wasi-http (style B)"
readme = "README.md"
publish = false
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
# Compile in the god-mode trip override route (operational tool, off by default).
god-mode = ["gtfs-adapter/god-mode"]

[lib]
crate-type = ["cdylib"]

[dependencies]
acme-common.workspace = true
anyhow.workspace = true
axum.workspace = true
bytes.workspace = true
gtfs-adapter.workspace = true
omnia-guest.workspace = true
omnia-wasi-http.workspace = true
omnia-wasi-messaging.workspace = true
omnia-wasi-otel.workspace = true
pulse-adapter.workspace = true
pulse-connector.workspace = true
serde_json.workspace = true
tally-connector.workspace = true
tracing.workspace = true
wasip3.workspace = true

[dev-dependencies]
cfg-if.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
anyhow.workspace = true
omnia.workspace = true
omnia-wasi-config.workspace = true
omnia-wasi-identity.workspace = true
omnia-wasi-keyvalue.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[example]]
name = "axum-runner"
path = "examples/runner.rs"

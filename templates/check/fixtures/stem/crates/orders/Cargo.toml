[package]
name = "orders"
description = "Placing orders"
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[[example]]
name = "orders-guest"
path = "guest.rs"
crate-type = ["cdylib"]

[build-dependencies]
omnia-test = { workspace = true, features = ["build"] }

# Target-gated so the guest's wasm32 dependency graph never sees the host.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
bytes.workspace = true
omnia.workspace = true
omnia-test = { workspace = true, features = ["host"] }
omnia-wasi-config.workspace = true
omnia-wasi-http.workspace = true
omnia-wasi-keyvalue.workspace = true
omnia-wasi-messaging.workspace = true
omnia-wasi-otel.workspace = true
omnia-wasi-sql.workspace = true
tokio.workspace = true

# One line per crate the stem's files use, each added at the end.
[dependencies]
axum.workspace = true
common.workspace = true
omnia-sdk.workspace = true
quick-xml.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

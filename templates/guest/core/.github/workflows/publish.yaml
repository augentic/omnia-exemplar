name: Publish Release

on:
  workflow_dispatch:

permissions: {}

jobs:
  skip:
    name: Skipped
    if: ${{ !startsWith(github.ref_name, 'release-') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo "This workflow only runs on the 'release-*' branches"
          exit 1

  ci:
    name: CI
    if: ${{ startsWith(github.ref_name, 'release-') }}
    permissions:
      contents: read
    uses: augentic/toolkit/.github/workflows/ci.yaml@v0.6.0
    with:
      targets: wasm32-wasip2

  publish:
    name: Publish
    needs: ci
    permissions:
      contents: write
    uses: augentic/toolkit/.github/workflows/publish.yaml@v0.6.0

  deploy:
    name: Deploy
    needs: publish
    permissions:
      contents: read
      id-token: write
    uses: augentic/toolkit/.github/workflows/wasm.yaml@v0.6.0
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    with:
      package: guest
      app-name: ${{ vars.APP_NAME || github.event.repository.name }}
      storage-account: ${{ vars.STORAGE_ACCOUNT }}
      resource-group: ${{ vars.RESOURCE_GROUP }}

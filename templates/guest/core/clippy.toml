# https://doc.rust-lang.org/stable/clippy/index.html

doc-valid-idents = [
  # Add project-specific identifiers here (e.g. "GTFS", "OpenLR")
  "OpenTelemetry",
  "WebAssembly",
  "WebSocket",
  "WebSockets",
]

# The host boundary. A guest reaches the world through its provider's
# capabilities alone, and the host owns the process, the clock, the file
# system, the network, and the environment. Each entry names the capability
# to reach instead; the workspace forbids these lints, so a crate cannot
# lift them and the repair is that capability. The `tokio` entries hold
# whatever features a crate enables, so they are admitted unresolved.
disallowed-methods = [
  { path = "std::env::var", reason = "a setting is read through `Config::get` at use, under a key the crate declares" },
  { path = "std::env::var_os", reason = "a setting is read through `Config::get` at use, under a key the crate declares" },
  { path = "std::env::vars", reason = "a setting is read through `Config::get` at use, under a key the crate declares" },
  { path = "std::env::args", reason = "a guest takes no arguments; its input arrives on a route or a topic" },
  { path = "std::env::args_os", reason = "a guest takes no arguments; its input arrives on a route or a topic" },
  { path = "std::env::current_dir", reason = "a guest has no working directory; a file is a blob through `BlobStore` or a document through `DocumentDb`" },
  { path = "std::env::set_current_dir", reason = "a guest has no working directory; a file is a blob through `BlobStore` or a document through `DocumentDb`" },
  { path = "std::env::current_exe", reason = "a guest has no host executable path" },
  { path = "std::env::temp_dir", reason = "scratch state that outlives a call is a `StateStore` entry with a TTL" },
  { path = "std::path::absolute", reason = "a guest has no working directory; a file is a blob through `BlobStore` or a document through `DocumentDb`" },
  { path = "std::fs::read", reason = "a file is a blob through `BlobStore` or a document through `DocumentDb`" },
  { path = "std::fs::read_to_string", reason = "a file is a blob through `BlobStore` or a document through `DocumentDb`" },
  { path = "std::fs::write", reason = "a file is a blob through `BlobStore` or a document through `DocumentDb`" },
  { path = "std::fs::remove_file", reason = "a file is a blob through `BlobStore` or a document through `DocumentDb`" },
  { path = "std::fs::create_dir_all", reason = "a file is a blob through `BlobStore` or a document through `DocumentDb`" },
  { path = "std::fs::read_dir", reason = "a file is a blob through `BlobStore` or a document through `DocumentDb`" },
  { path = "std::thread::spawn", reason = "the host drives every handler; nothing runs beside one" },
  { path = "std::thread::scope", reason = "the host drives every handler; nothing runs beside one" },
  { path = "std::thread::sleep", reason = "the host owns the clock; a retry is one more attempt, never a wait" },
  { path = "std::thread::park", reason = "the host owns the clock; a retry is one more attempt, never a wait" },
  { path = "std::thread::park_timeout", reason = "the host owns the clock; a retry is one more attempt, never a wait" },
  { path = "std::thread::available_parallelism", reason = "the host drives every handler; nothing runs beside one" },
  { path = "std::time::SystemTime::now", reason = "a timestamp is `chrono::Utc::now()`, serialised as RFC 3339" },
  { path = "std::time::SystemTime::elapsed", reason = "a duration is the difference of two `chrono::Utc::now()` readings; the host owns every deadline" },
  { path = "std::time::Instant::now", reason = "a duration is the difference of two `chrono::Utc::now()` readings; the host owns every deadline" },
  { path = "std::time::Instant::elapsed", reason = "a duration is the difference of two `chrono::Utc::now()` readings; the host owns every deadline" },
  { path = "std::process::exit", reason = "a handler answers an error; the host owns the process" },
  { path = "std::process::abort", reason = "a handler answers an error; the host owns the process" },
  { path = "std::net::ToSocketAddrs::to_socket_addrs", reason = "an upstream is reached through `HttpClient::fetch`" },
  { path = "tokio::spawn", reason = "the host drives every handler; nothing runs beside one", allow-invalid = true },
  { path = "tokio::task::spawn", reason = "the host drives every handler; nothing runs beside one", allow-invalid = true },
  { path = "tokio::task::spawn_blocking", reason = "the host drives every handler; nothing runs beside one", allow-invalid = true },
  { path = "tokio::time::sleep", reason = "the host owns the clock; a retry is one more attempt, never a wait", allow-invalid = true },
  { path = "tokio::time::interval", reason = "the host owns the clock; a periodic job is a topic or a route the host drives", allow-invalid = true },
  { path = "tokio::time::timeout", reason = "the host bounds every call; a handler sets no deadline of its own", allow-invalid = true },
]

disallowed-types = [
  { path = "std::fs::File", reason = "a file is a blob through `BlobStore` or a document through `DocumentDb`" },
  { path = "std::fs::OpenOptions", reason = "a file is a blob through `BlobStore` or a document through `DocumentDb`" },
  { path = "std::net::TcpListener", reason = "the host listens; a guest serves routes" },
  { path = "std::net::TcpStream", reason = "an upstream is reached through `HttpClient::fetch`" },
  { path = "std::net::UdpSocket", reason = "an upstream is reached through `HttpClient::fetch`" },
  { path = "std::process::Command", reason = "a guest runs no process" },
  { path = "std::thread::Builder", reason = "the host drives every handler; nothing runs beside one" },
  { path = "std::sync::OnceLock", reason = "a guest keeps nothing across calls; `StateStore` holds what outlives one" },
  { path = "std::sync::LazyLock", reason = "a guest keeps nothing across calls; `StateStore` holds what outlives one" },
  { path = "std::sync::Once", reason = "a guest keeps nothing across calls; `StateStore` holds what outlives one" },
]

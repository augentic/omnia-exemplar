# https://doc.rust-lang.org/stable/clippy/index.html

doc-valid-idents = [
  # Add project-specific identifiers here (e.g. "GTFS", "OpenLR")
  "OpenTelemetry",
  "WebAssembly",
  "WebSocket",
  "WebSockets",
]

# The host boundary. A guest reaches the world through its provider's
# capabilities alone, and the host owns the process, the clock, the file
# system, the network, and the environment. Each entry names the capability
# to reach instead; the workspace forbids these lints, so a crate cannot
# lift them and the repair is that capability. The `tokio` entries hold
# whatever features a crate enables, so they are admitted unresolved.
disallowed-methods = [
  { path = "std::env::var", reason = "a setting is read through `Config::get` at use, under a key the crate declares" },
  { path = "std::env::var_os", reason = "a setting is read through `Config::get` at use, under a key the crate declares" },
  { path = "std::env::vars", reason = "a setting is read through `Config::get` at use, under a key the crate declares" },
  { path = "std::env::args", reason = "a guest takes no arguments; its input arrives on a route or a topic" },
  { path = "std::fs::read", reason = "a file is a blob through `BlobStore` or a document through `DocumentStore`" },
  { path = "std::fs::read_to_string", reason = "a file is a blob through `BlobStore` or a document through `DocumentStore`" },
  { path = "std::fs::write", reason = "a file is a blob through `BlobStore` or a document through `DocumentStore`" },
  { path = "std::thread::spawn", reason = "the host drives every handler; nothing runs beside one" },
  { path = "std::thread::sleep", reason = "the host owns the clock; a retry is one more attempt, never a wait" },
  { path = "std::process::exit", reason = "a handler answers an error; the host owns the process" },
  { path = "tokio::spawn", reason = "the host drives every handler; nothing runs beside one", allow-invalid = true },
  { path = "tokio::task::spawn", reason = "the host drives every handler; nothing runs beside one", allow-invalid = true },
  { path = "tokio::task::spawn_blocking", reason = "the host drives every handler; nothing runs beside one", allow-invalid = true },
  { path = "tokio::time::sleep", reason = "the host owns the clock; a retry is one more attempt, never a wait", allow-invalid = true },
  { path = "tokio::time::interval", reason = "the host owns the clock; a periodic job is a topic or a route the host drives", allow-invalid = true },
  { path = "tokio::time::timeout", reason = "the host bounds every call; a handler sets no deadline of its own", allow-invalid = true },
]

disallowed-types = [
  { path = "std::fs::File", reason = "a file is a blob through `BlobStore` or a document through `DocumentStore`" },
  { path = "std::fs::OpenOptions", reason = "a file is a blob through `BlobStore` or a document through `DocumentStore`" },
  { path = "std::net::TcpListener", reason = "the host listens; a guest serves routes" },
  { path = "std::net::TcpStream", reason = "an upstream is reached through `HttpRequest::fetch`" },
  { path = "std::net::UdpSocket", reason = "an upstream is reached through `HttpRequest::fetch`" },
  { path = "std::process::Command", reason = "a guest runs no process" },
  { path = "std::sync::OnceLock", reason = "a guest keeps nothing across calls; `StateStore` holds what outlives one" },
  { path = "std::sync::LazyLock", reason = "a guest keeps nothing across calls; `StateStore` holds what outlives one" },
]

disallowed-macros = [
  { path = "std::include_str", reason = "a table the program reads is a constant in code or a document through `DocumentStore`, never a file compiled in" },
  { path = "std::include_bytes", reason = "a table the program reads is a constant in code or a document through `DocumentStore`, never a file compiled in" },
]

name: Publish Release

on:
  workflow_dispatch:

jobs:
  skip:
    name: Skipped
    if: ${{ !startsWith(github.ref_name, 'release-') }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "This workflow only runs on the 'release-*' branches"
          exit 1

  ci:
    name: CI
    if: ${{ startsWith(github.ref_name, 'release-') }}
    uses: augentic/toolkit/.github/workflows/ci.yaml@v0.4.0
    secrets: inherit
    with:
      targets: wasm32-wasip2

  publish:
    name: Publish
    needs: ci
    uses: augentic/toolkit/.github/workflows/publish.yaml@v0.4.0

  deploy:
    name: Deploy
    needs: publish
    uses: augentic/toolkit/.github/workflows/wasm.yaml@v0.4.0
    secrets: inherit
    with:
      package: <PACKAGE_NAME>
      storage-account: <STORAGE_ACCOUNT>
      resource-group: <RESOURCE_GROUP>

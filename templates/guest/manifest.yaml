# Guest template contract: the single source-to-target map for the Omnia
# base-repo scaffold. The `omnia-template` crate beside this file embeds
# the same map as Rust, with every body compiled in, for the Emery omnia
# target adapter to depend on; the `template-check` gate (inside
# `mise run test`, or stand-alone via `cargo run -p template-check`)
# validates this manifest and holds the crate's table to it entry for
# entry.
#
# Every `source` is repository-relative. Proof modes:
#   exact — `source` IS the repository-root file at `target` (source ==
#           target, no tokens, no second copy): this repository's green
#           CI is the template's proof.
#   seed  — a project-start baseline the consuming project immediately
#           evolves (the root package and the lists a build appends to,
#           vet state, the lint configuration, deploy parameters); the
#           body lives under `templates/guest/core/` at the target's own
#           path, is rendered with `values.yaml` and syntax-checked, and
#           is never diffed against the root.

schema-version: 3

tokens: {}

assemblies:
  core:
    path-mode: content-only
    files:
      - source: templates/guest/core/Cargo.toml
        target: Cargo.toml
        proof: seed
      - source: templates/guest/core/src/lib.rs
        target: src/lib.rs
        proof: seed
      - source: templates/guest/core/src/routes.rs
        target: src/routes.rs
        proof: seed
      - source: templates/guest/core/src/messaging.rs
        target: src/messaging.rs
        proof: seed
      - source: templates/guest/core/tests/routes.rs
        target: tests/routes.rs
        proof: seed
      - source: templates/guest/core/tests/messaging.rs
        target: tests/messaging.rs
        proof: seed
      - source: templates/guest/core/examples/runtime.rs
        target: examples/runtime.rs
        proof: seed
      - source: templates/guest/core/crates/common/Cargo.toml
        target: crates/common/Cargo.toml
        proof: seed
      - source: templates/guest/core/crates/common/src/lib.rs
        target: crates/common/src/lib.rs
        proof: seed
      - source: templates/guest/core/crates/common/src/config.rs
        target: crates/common/src/config.rs
        proof: seed
      - source: templates/guest/core/crates/common/src/topic.rs
        target: crates/common/src/topic.rs
        proof: seed
      - source: Makefile
        target: Makefile
        proof: exact
      - source: mise.toml
        target: mise.toml
        proof: exact
      - source: templates/guest/core/deny.toml
        target: deny.toml
        proof: seed
      - source: rust-toolchain.toml
        target: rust-toolchain.toml
        proof: exact
      - source: rustfmt.toml
        target: rustfmt.toml
        proof: exact
      - source: templates/guest/core/clippy.toml
        target: clippy.toml
        proof: seed
      - source: taplo.toml
        target: taplo.toml
        proof: exact
      - source: .gitignore
        target: .gitignore
        proof: exact
      - source: .vscode/settings.json
        target: .vscode/settings.json
        proof: exact
      - source: supply-chain/README.md
        target: supply-chain/README.md
        proof: exact
      - source: templates/guest/core/supply-chain/config.toml
        target: supply-chain/config.toml
        proof: seed
      - source: templates/guest/core/supply-chain/audits.toml
        target: supply-chain/audits.toml
        proof: seed
      - source: .github/dependabot.yml
        target: .github/dependabot.yml
        proof: exact
      - source: .github/workflows/audit.yaml
        target: .github/workflows/audit.yaml
        proof: exact
      - source: .github/workflows/ci.yaml
        target: .github/workflows/ci.yaml
        proof: exact
      - source: .github/workflows/patch.yaml
        target: .github/workflows/patch.yaml
        proof: exact
      - source: .github/workflows/release.yaml
        target: .github/workflows/release.yaml
        proof: exact
      - source: templates/guest/core/.github/workflows/publish.yaml
        target: .github/workflows/publish.yaml
        proof: seed

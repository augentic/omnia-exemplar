# Guest template contract: the single source-to-target map for the Omnia
# base-repo scaffold. Read at consumer-build time by the Emery omnia
# target adapter from the build agent's checkout of this repository;
# validated here by `cargo make template-check`.
#
# Every `source` is repository-relative. Proof modes:
#   exact — `source` IS the repository-root file at `target` (source ==
#           target, no tokens, no second copy): this repository's green
#           CI is the template's proof.
#   seed  — a project-start baseline the consuming project immediately
#           evolves (vet state, clippy duplicate lists, deploy
#           parameters); the body lives under `templates/guest/core/`,
#           is rendered with `values.yaml` and syntax-checked, and is
#           never diffed against the root.

schema-version: 3

tokens:
  PACKAGE_NAME: Cargo package name of the deployable guest, filled by the guest writer.
  CRATE_NAME: PACKAGE_NAME as a Rust path (hyphens as underscores), as `tests/` names the crate.
  STORAGE_ACCOUNT: Azure storage account receiving the built component.
  RESOURCE_GROUP: Azure resource group owning the storage account.

assemblies:
  core:
    path-mode: content-only
    files:
      - source: templates/guest/core/Cargo.toml
        target: Cargo.toml
        proof: seed
      - source: templates/guest/core/src-lib.rs
        target: src/lib.rs
        proof: seed
      - source: templates/guest/core/tests-routes.rs
        target: tests/routes.rs
        proof: seed
      - source: Makefile
        target: Makefile
        proof: exact
      - source: Makefile.toml
        target: Makefile.toml
        proof: exact
      - source: templates/guest/core/deny.toml
        target: deny.toml
        proof: seed
      - source: rust-toolchain.toml
        target: rust-toolchain.toml
        proof: exact
      - source: rustfmt.toml
        target: rustfmt.toml
        proof: exact
      - source: templates/guest/core/clippy.toml
        target: clippy.toml
        proof: seed
      - source: taplo.toml
        target: taplo.toml
        proof: exact
      - source: .gitignore
        target: .gitignore
        proof: exact
      - source: .vscode/settings.json
        target: .vscode/settings.json
        proof: exact
      - source: supply-chain/README.md
        target: supply-chain/README.md
        proof: exact
      - source: templates/guest/core/supply-chain-config.toml
        target: supply-chain/config.toml
        proof: seed
      - source: templates/guest/core/supply-chain-audits.toml
        target: supply-chain/audits.toml
        proof: seed
      - source: .github/workflows/audit.yaml
        target: .github/workflows/audit.yaml
        proof: exact
      - source: .github/workflows/ci.yaml
        target: .github/workflows/ci.yaml
        proof: exact
      - source: .github/workflows/patch.yaml
        target: .github/workflows/patch.yaml
        proof: exact
      - source: .github/workflows/release.yaml
        target: .github/workflows/release.yaml
        proof: exact
      - source: templates/guest/core/workflow-publish.yaml
        target: .github/workflows/publish.yaml
        proof: seed
